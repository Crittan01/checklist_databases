---
# Plugin Oracle Inventory - Configuración
plugin: oracle_inventory

# Archivo Excel fuente
excel_file: "inventory/InventarioBD.xlsx"

# Hoja del Excel a leer
sheet_name: "ORACLE"

# Filtros dinámicos para AWX/AAP
filters:
  # Ejemplo: Ambiente específico desde survey
  Ambiente: "{{ target_environment | default('') }}"

  # Ejemplo: Host específico desde survey
  Host: "{{ target_host | default('') }}"

  # Ejemplo: Datacenter específico
  # Datacenter: "{{ target_datacenter | default('') }}"
