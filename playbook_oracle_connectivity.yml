---
# Playbook modular - Solo Conectividad Oracle
- name: Oracle Database Connectivity Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []

  pre_tasks:
    - name: "Validar target_database si está especificada"
      ansible.builtin.fail:
        msg: |
          ERROR: Base de datos '{{ target_database }}' no existe en el inventario.
          Bases disponibles: {{ oracle_databases.keys() | list | join(', ') }}
          Usa: ansible-playbook playbook_oracle_connectivity.yml -e target_database=NOMBRE_VALIDO
          O ejecuta sin -e para validar todas las bases
      when:
        - target_database is defined
        - target_database != ''
        - target_database not in oracle_databases.keys()

  tasks:
    - name: "Validar conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_conn
      vars:
        oracle_conn_current_database_key: "{{ item.key }}"
        oracle_conn_current_database: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: target_database is not defined or target_database == '' or item.key == target_database

  post_tasks:
    - name: "Verificar que se ejecutó al menos una validación"
      ansible.builtin.fail:
        msg: |
          ADVERTENCIA: No se ejecutaron validaciones.
          Causa probable: target_database='{{ target_database | default("") }}' no coincide con ninguna base configurada.
          Bases disponibles: {{ oracle_databases.keys() | list | join(', ') }}
      when: connectivity_results | length == 0

    - name: "Resumen final de conectividad"
      ansible.builtin.debug:
        msg:
          - "=== RESUMEN CONECTIVIDAD ==="
          - "Bases validadas: {{ connectivity_results | length }}"
          - "Bases disponibles: {{ oracle_databases.keys() | list | join(', ') }}"
          - "Conectadas: {{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list | length }}"
          - "Con errores: {{ connectivity_results | selectattr('connection_successful', 'equalto', false) | list | length }}"
