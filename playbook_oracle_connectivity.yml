---
# Playbook modular - Solo Conectividad Oracle
- name: Oracle Database Connectivity Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    target_database: "{{ target_database | default('') }}"

  tasks:
    - name: "Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_connectivity
      vars:
        current_db_key: "{{ item.key }}"
        current_db: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      when: target_database == '' or item.key == target_database

  post_tasks:
    - name: "Resumen conectividad"
      ansible.builtin.debug:
        msg:
          - "Instancias probadas: {{ connectivity_results | length }}"
          - "Conectadas: {{ connectivity_results | selectattr('conectado', 'equalto', true) | list | length }}"
          - "Fallidas: {{ connectivity_results | selectattr('conectado', 'equalto', false) | list | length }}"
          - "Porcentaje: {{ ((connectivity_results | selectattr('conectado', 'equalto', true) | list
            | length / connectivity_results | length * 100) | round) if connectivity_results | length > 0 else 0 }}%"
