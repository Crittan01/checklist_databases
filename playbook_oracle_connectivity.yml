---
# Playbook modular - Solo Conectividad Oracle - OPTIMIZADO
- name: Oracle Database Connectivity Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []

  tasks:
    # Validación común
    - name: "Validar parámetros de entrada"
      ansible.builtin.include_role:
        name: oracle_utils
        tasks_from: validate_target_database.yml

    - name: "Validar conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_conn
        tasks_from: quick_check.yml
      vars:
        current_database_key: "{{ item.key }}"
        current_database: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: target_database is not defined or target_database == '' or item.key == target_database

    # Post-tasks consolidado
    - name: "Resumen de conectividad"
      ansible.builtin.include_role:
        name: oracle_utils
        tasks_from: connectivity_summary.yml
