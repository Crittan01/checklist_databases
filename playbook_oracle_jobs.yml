---
# Playbook modular - Solo Validación de Jobs
- name: Oracle Database Jobs Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    job_results: []
    target_database: "{{ target_database | default('') }}"

  tasks:
    # Conectividad primero
    - name: "Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_connectivity
      vars:
        current_db_key: "{{ item.key }}"
        current_db: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      when: target_database == '' or item.key == target_database

    # Solo jobs en conectadas
    - name: "Jobs {{ item.instancia }}"
      ansible.builtin.include_role:
        name: oracle_jobs
      vars:
        current_db_key: "{{ item.instancia }}"
        current_db: "{{ oracle_databases[item.instancia] }}"
      loop: "{{ connectivity_results | selectattr('conectado', 'equalto', true) | list }}"

    # Reporte específico
    - name: "Generar reporte jobs"
      ansible.builtin.include_role:
        name: inventory
      vars:
        backup_results: []
        diskgroup_results: []

  post_tasks:
    - name: "Resumen jobs"
      ansible.builtin.debug:
        msg:
          - "Instancias validadas: {{ job_results | length }}"
          - "Jobs broken: {{ job_results | map(attribute='data') | flatten | selectattr('3', 'equalto', 'Y') | list | length }}"
          - "Jobs con failures: {{ job_results | map(attribute='data') | flatten | selectattr('2', 'greaterthan', 0) | list | length }}"
