---
# Playbook modular - Solo Validación de Backups
- name: Oracle Database Backups Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    backup_results: []
    target_database: "{{ target_database | default('') }}"

  tasks:
    # Conectividad primero
    - name: "Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_connectivity
      vars:
        current_db_key: "{{ item.key }}"
        current_db: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      when: target_database == '' or item.key == target_database

    # Solo backups en conectadas
    - name: "Backups {{ item.instancia }}"
      ansible.builtin.include_role:
        name: oracle_backups
      vars:
        current_db_key: "{{ item.instancia }}"
        current_db: "{{ oracle_databases[item.instancia] }}"
      loop: "{{ connectivity_results | selectattr('conectado', 'equalto', true) | list }}"

    # Reporte específico
    - name: "Generar reporte backups"
      ansible.builtin.include_role:
        name: inventory
      vars:
        job_results: []
        diskgroup_results: []

  post_tasks:
    - name: "Resumen backups"
      ansible.builtin.debug:
        msg:
          - "Instancias validadas: {{ backup_results | length }}"
          - "Backups fallidos: {{ backup_results | map(attribute='data') | flatten | selectattr('5', 'equalto', 'FAILED') | list | length }}"
          - "Sin ARCHIVELOG 12h: {{ backup_results | selectattr('data', 'defined') | selectattr('data', 'length') | map(attribute='data')
            | select('selectattr', '4', 'equalto', 'ARCHIVELOG') | select('length') | select('equalto', 0) | list | length }}"
