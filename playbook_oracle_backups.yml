---
# Playbook modular - Solo Validación de Backups
- name: Oracle Database Backups Validation Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    backup_results: []

  tasks:
    # Primero verificar conectividad
    - name: "Verificar conectividad {{ item.key }}"
      loop: "{{ oracle_databases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_conn
      vars:
        oracle_conn_current_database_key: "{{ item.key }}"
        oracle_conn_current_database: "{{ item.value }}"
      when: target_database is not defined or target_database == '' or item.key == target_database

    # Validar backups solo en DBs conectadas
    - name: "Validar backups {{ item.instancia_key }}"
      loop: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_bk
      vars:
        oracle_bk_current_database_key: "{{ item.instancia_key }}"
        oracle_bk_current_database: "{{ oracle_databases[item.instancia_key] }}"

  post_tasks:
    - name: "Mostrar resultado de backups"
      ansible.builtin.debug:
        msg:
          - "=== RESULTADO VALIDACIÓN BACKUPS ==="
          - "Instancia: {{ item.instancia_key }}"
          - "Backups encontrados: {{ item.backup_data | length }}"
          - "Backups fallidos: {{ item.backup_errors | length }}"
          - "Sin ARCHIVELOG 12h: {{ item.no_archivelog_in_12h | default(false) }}"
          - "Estado: {{ 'CRÍTICO' if item.backup_errors | length > 0 else ('ADVERTENCIA' if item.no_archivelog_in_12h | default(false) else 'OK') }}"
      loop: "{{ backup_results }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      when: backup_results | length > 0
