---
# Configuración global Oracle
oracle_timeout: 60

# Configuración 'common' para validaciones
oracle_common:
  error_patterns: ["ORA-", "TNS-", "Error"]
  validation_timeout: 60
  connection_retry: 1

# Inventario de bases de datos
