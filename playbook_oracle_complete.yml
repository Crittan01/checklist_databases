---
# Playbook para AAP - Checklist Oracle Completo
- name: Oracle Database Complete Inventory and Validations
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    backup_results: []
    job_results: []

  pre_tasks:
    - name: "Mostrar inicio del checklist completo"
      ansible.builtin.debug:
        msg:
          - "=== CHECKLIST ORACLE COMPLETO ==="
          - "Bases configuradas: {{ oracle_databases.keys() | list | join(', ') }}"
          - "Total: {{ oracle_databases.keys() | list | length }} instancias"

  tasks:
    # FASE 1: CONECTIVIDAD (Estandarizada)
    - name: "FASE 1: Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_conn
      vars:
        current_database_key: "{{ item.key }}"
        current_database: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # FASE 2: BACKUPS (Estandarizada)
    - name: "FASE 2: Backups {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_bk
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.instancia_key }}"

    # FASE 3: JOBS (Estandarizada)
    - name: "FASE 3: Jobs {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_jobs
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.instancia_key }}"

    # GENERAR REPORTE
    - name: "Generar reporte HTML completo"
      ansible.builtin.include_role:
        name: inventory
      vars:
        report_connectivity_results: "{{ connectivity_results }}"
        report_backup_results: "{{ backup_results }}"
        report_job_results: "{{ job_results }}"
        report_oracle_databases: "{{ oracle_databases }}"

  post_tasks:
    - name: "Resumen ejecutivo"
      ansible.builtin.debug:
        msg:
          - "=== RESUMEN EJECUTIVO ==="
          - "Conectividad: {{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list | length }}
            /{{ connectivity_results | length }}"
          - "Backups con error: {{ backup_results | map(attribute='failed_backups') | map('int') | sum }}"
          - "Jobs broken: {{ job_results | map(attribute='broken_jobs_count') | map('int') | sum }}"
          - "Reporte: reports/oracle_inventory_report_{{ ansible_date_time.date }}.html"
