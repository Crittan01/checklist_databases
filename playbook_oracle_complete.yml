---
# Playbook para AAP - Checklist Oracle Completo
- name: Oracle Database Complete Inventory
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    backup_results: []
    job_results: []
    diskgroup_results: []

  tasks:
    # CONECTIVIDAD
    - name: "Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_connectivity
      vars:
        current_db_key: "{{ item.key }}"
        current_db: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"

    # BACKUPS (solo conectadas)
    - name: "Backups {{ item.instancia }}"
      ansible.builtin.include_role:
        name: oracle_backups
      vars:
        current_db_key: "{{ item.instancia }}"
        current_db: "{{ oracle_databases[item.instancia] }}"
      loop: "{{ connectivity_results | selectattr('conectado', 'equalto', true) | list }}"

    # JOBS (solo conectadas)
    - name: "Jobs {{ item.instancia }}"
      ansible.builtin.include_role:
        name: oracle_jobs
      vars:
        current_db_key: "{{ item.instancia }}"
        current_db: "{{ oracle_databases[item.instancia] }}"
      loop: "{{ connectivity_results | selectattr('conectado', 'equalto', true) | list }}"

    # DISKGROUPS (solo conectadas)
    - name: "Diskgroups {{ item.instancia }}"
      ansible.builtin.include_role:
        name: oracle_diskgroups
      vars:
        current_db_key: "{{ item.instancia }}"
        current_db: "{{ oracle_databases[item.instancia] }}"
      loop: "{{ connectivity_results | selectattr('conectado', 'equalto', true) | list }}"

    # REPORTE
    - name: "Generar reporte HTML"
      ansible.builtin.include_role:
        name: inventory

  post_tasks:
    - name: "Resumen ejecutivo"
      ansible.builtin.debug:
        msg:
          - "Bases probadas: {{ connectivity_results | length }}"
          - "Conectadas: {{ connectivity_results | selectattr('conectado', 'equalto', true) | list | length }}"
          - "Backups fallidos: {{ backup_results | map(attribute='data') | flatten | selectattr('5', 'equalto', 'FAILED') | list | length }}"
          - "Jobs broken: {{ job_results | map(attribute='data') | flatten | selectattr('3', 'equalto', 'Y') | list | length }}"
          - "Diskgroups críticos: {{ diskgroup_results | map(attribute='data') | flatten | length }}"
