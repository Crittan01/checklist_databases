---
# Playbook para AAP - Checklist Oracle Completo
- name: Oracle Database Complete Inventory and Validations
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    backup_results: []
    job_results: []
    diskgroup_results: []
    execution_timestamp: "{{ ansible_date_time.iso8601 }}"
    report_date: "{{ ansible_date_time.date }}"

  pre_tasks:
    - name: "Mostrar inicio del checklist completo"
      ansible.builtin.debug:
        msg:
          - "=== CHECKLIST ORACLE COMPLETO ==="
          - "Bases de datos configuradas: {{ oracle_databases.keys() | list }}"
          - "Total de instancias: {{ oracle_databases.keys() | list | length }}"
          - "Validaciones: Conectividad + Backups + Jobs"

  tasks:
    # FRENTE 1: CONECTIVIDAD
    - name: "FRENTE 1: Validar conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_connectivity
      vars:
        oracle_connectivity_current_database_key: "{{ item.key }}"
        oracle_connectivity_current_database: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # FRENTE 2: BACKUPS (Solo DBs conectadas)
    - name: "FRENTE 2: Validar backups {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_backups
      vars:
        oracle_backups_current_database_key: "{{ item.instancia_key }}"
        oracle_backups_current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.instancia_key }}"

    # FRENTE 3: JOBS (Solo DBs conectadas)
    - name: "FRENTE 3: Validar jobs {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_jobs
      vars:
        oracle_jobs_current_database_key: "{{ item.instancia_key }}"
        oracle_jobs_current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.instancia_key }}"

    # FRENTE 4: DISKGROUPS (Solo DBs conectadas)
    - name: "FRENTE 4: Validar diskgroups {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_diskgroups
      vars:
        oracle_diskgroups_current_database_key: "{{ item.instancia_key }}"
        oracle_diskgroups_current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.instancia_key }}"

    # GENERAR REPORTE HTML COMPLETO
    - name: "Generar reporte HTML completo"
      ansible.builtin.include_role:
        name: inventory
      vars:
        inventory_report_connectivity_results: "{{ connectivity_results }}"
        inventory_report_backup_results: "{{ backup_results }}"
        inventory_report_job_results: "{{ job_results }}"
        inventory_report_oracle_databases: "{{ oracle_databases }}"

  post_tasks:
    - name: "Resumen final del checklist completo"
      ansible.builtin.debug:
        msg:
          - "=== RESUMEN CHECKLIST COMPLETO ==="
          - "Bases de datos probadas: {{ connectivity_results | length }}"
          - "Conexiones exitosas: {{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list | length }}"
          - "Conexiones fallidas: {{ connectivity_results | selectattr('connection_successful', 'equalto', false) | list | length }}"
          - "Backups validados: {{ backup_results | length }}"
          - "Backups con error: {{ backup_results | map(attribute='backup_errors') | flatten | length }}"
          - "Jobs validados: {{ job_results | length }}"
          - "Jobs broken: {{ job_results | map(attribute='broken_jobs') | flatten | length }}"
