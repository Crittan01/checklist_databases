---
# Playbook para AAP - Checklist Oracle Completo
- name: Oracle Database Complete Inventory and Validations
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # INICIALIZACIÓN EXPLÍCITA - Evita variables undefined
    connectivity_results: []
    backup_results: []
    job_results: []
    diskgroup_results: []
    dataguard_results: []
    stats_results: []

  pre_tasks:
    - name: "Mostrar inicio del checklist completo"
      ansible.builtin.debug:
        msg:
          - "=== CHECKLIST ORACLE COMPLETO ==="
          - "Bases configuradas: {{ oracle_databases.keys() | list | join(', ') }}"
          - "Total: {{ oracle_databases.keys() | list | length }} instancias"

  tasks:
    # FASE 1: CONECTIVIDAD
    - name: "FASE 1: Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_conn
      vars:
        current_database_key: "{{ item.key }}"
        current_database: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # VERIFICACIÓN DE CONECTIVIDAD EXITOSA
    - name: "Verificar si hay conexiones exitosas"
      ansible.builtin.set_fact:
        successful_connections: "{{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list }}"

    # FASE 2: BACKUPS (Solo si hay conexiones exitosas)
    - name: "FASE 2: Backups {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_bk
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ successful_connections }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      when: successful_connections | length > 0

    # FASE 3: JOBS (Solo si hay conexiones exitosas)
    - name: "FASE 3: Jobs {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_jobs
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ successful_connections }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      when: successful_connections | length > 0

    # FASE 4: DISKGROUPS (Solo si hay conexiones exitosas)
    - name: "FASE 4: Diskgroups {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_diskgroups
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ successful_connections }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      when: successful_connections | length > 0

    # FASE 5: DATAGUARD (Solo si hay conexiones exitosas)
    - name: "FASE 5: DataGuard {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_dataguard
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ successful_connections }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      when: successful_connections | length > 0

    - name: "FASE 6: Estadísticas {{ item.instancia_key }}"
      ansible.builtin.include_role:
        name: oracle_stats
      vars:
        current_database_key: "{{ item.instancia_key }}"
        current_database: "{{ oracle_databases[item.instancia_key] }}"
      loop: "{{ successful_connections }}"
      loop_control:
        label: "{{ item.instancia_key }}"
      when: successful_connections | length > 0

    # GENERAR REPORTE - VARIABLES SEGURAS
    - name: "Generar reporte HTML completo"
      ansible.builtin.include_role:
        name: inventory
      vars:
        # PASAR LISTAS DIRECTAMENTE - Sin referencia circular
        report_connectivity_results: "{{ connectivity_results }}"
        report_backup_results: "{{ backup_results }}"
        report_job_results: "{{ job_results }}"
        report_oracle_databases: "{{ oracle_databases }}"
        report_diskgroup_results: "{{ diskgroup_results }}"
        report_dataguard_results: "{{ dataguard_results }}"
        report_stats_results: "{{ stats_results }}"

  post_tasks:
    - name: "Resumen ejecutivo"
      ansible.builtin.debug:
        msg:
          - "=== RESUMEN EJECUTIVO ==="
          - "Conectividad: {{ connectivity_results | selectattr('connection_successful', 'equalto', true) | list | length }}
            /{{ connectivity_results | length }}"
          - "Backups validados: {{ backup_results | length }}"
          - "Jobs validados: {{ job_results | length }}"
          - "Diskgroups validados: {{ diskgroup_results | default([]) | length }}"
          - "DataGuard validados: {{ dataguard_results | default([]) | length }}"
          - "ALERTAS:"
          - "  - Backups con error: {{ backup_results | map(attribute='failed_backups') | map('int') | sum }}"
          - "  - Jobs broken: {{ job_results | map(attribute='broken_jobs_count') | map('int') | sum }}"
          - "  - Diskgroups críticos: {{ diskgroup_results | default([]) | map(attribute='total_critical_diskgroups') | map('int') | sum }}"
          - "  - DataGuard lag crítico: {{ dataguard_results | default([]) | map(attribute='critical_threads') | map('int') | sum }}"
          - "  - Tablas con estadísticas stale: {{ stats_results | default([]) | map(attribute='total_stale_tables') | map('int') | sum }}"
          - "Reporte: reports/oracle_inventory_report_{{ ansible_date_time.date }}.html"
