---
# tasks file for roles/oracle_diskgroups
- name: "Validar diskgroups {{ current_db_key }}"
  opitzconsulting.ansible_oracle.oracle_sql:
    hostname: "{{ current_db.direccion_ip }}"
    port: "{{ current_db.puerto }}"
    service_name: "{{ current_db.cadena_tns }}"
    username: "{{ current_db.usuario }}"
    password: "{{ current_db.password }}"
    sql: |
      SELECT
        HOST_NAME,
        NAME,
        STATE,
        TYPE,
        TOTAL_MB,
        FREE_MB,
        TOTAL_MB-FREE_MB as OCUPADO_MB,
        ((TOTAL_MB-FREE_MB)/TOTAL_MB*100) as PORC_OCUPADO
      FROM V$ASM_DISKGROUP, v$instance
      WHERE ((TOTAL_MB-FREE_MB)/TOTAL_MB*100) > 80
      AND FREE_MB < 100000
      ORDER BY NAME, FREE_MB/TOTAL_MB*100 DESC
    mode: normal
  register: diskgroup_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Registrar resultado {{ current_db_key }}"
  ansible.builtin.set_fact:
    diskgroup_results: "{{ diskgroup_results + [result_item] }}"
  vars:
    result_item:
      instancia: "{{ current_db_key }}"
      exitoso: "{{ not (diskgroup_result.failed | default(true)) }}"
      error: "{{ diskgroup_result.msg | default('') if diskgroup_result.failed | default(false) else '' }}"
      data: "{{ diskgroup_result.query_result | default([]) if not (diskgroup_result.failed | default(true)) else [] }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
