---
# tasks file for roles/oracle_bk
- name: "Backups últimas 12h {{ current_database_key }}"
  mi_org.oracle.oracle_sql_async:
    hostname: "{{ current_database.direccion_ip }}"
    port: "{{ current_database.puerto }}"
    service_name: "{{ current_database.cadena_tns }}"
    username: "{{ current_database.usuario }}"
    password: "{{ current_database.password }}"
    sql: |
      SELECT
        vi.host_name,
        vi.instance_name,
        TO_CHAR(rbd.start_time,'MM-DD-YYYY HH24:MI:SS') as start_time,
        TO_CHAR(rbd.end_time,'MM-DD-YYYY HH24:MI:SS') as end_time,
        rbd.input_type,
        rbd.status,
        (rbd.end_time-rbd.start_time)*24*60 as min_duration,
        rbd.output_bytes_display,
        rbd.output_device_type
      FROM v$rman_backup_job_details rbd, v$instance vi
      WHERE rbd.start_time > sysdate - 0.5
      ORDER BY rbd.start_time
    mode: normal
  register: backup_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Procesar backups {{ current_database_key }}"
  ansible.builtin.set_fact:
    backup_results: "{{ backup_results + [backup_item] }}"
  vars:
    # Detección de errores usando regex
    msg_string: "{{ backup_result.msg | default('') | string }}"
    has_oracle_error: "{{ msg_string is search('ORA-') or msg_string is search('TNS-') }}"
    has_failed: "{{ backup_result.failed | default(false) }}"
    is_successful: "{{ not has_failed and not has_oracle_error }}"

    # Datos solo si es exitoso
    backup_data: "{{ backup_result.msg | default([]) if is_successful and backup_result.msg is iterable and backup_result.msg is not string else [] }}"

    # Análisis usando índices
    failed_backups_list: "{{ backup_data | selectattr('5', 'equalto', 'FAILED') | list }}"
    archivelog_backups: "{{ backup_data | selectattr('4', 'equalto', 'ARCHIVELOG') | list }}"

    backup_item:
      instancia_key: "{{ current_database_key }}"
      instancia: "{{ current_database.instancia }}"
      host: "{{ current_database.host }}"
      direccion_ip: "{{ current_database.direccion_ip }}"

      # Estado de validación
      backup_validation_successful: "{{ is_successful }}"
      backup_validation_error: "{{ backup_result.msg | default('') if not is_successful else '' }}"

      # Datos y análisis
      backup_data: "{{ backup_data }}"
      backup_errors: "{{ failed_backups_list }}"

      # Alertas específicas
      no_archivelog_in_12h: "{{ archivelog_backups | length == 0 if is_successful else false }}"
      archivelog_count: "{{ archivelog_backups | length }}"

      # Contadores simplificados
      total_backups: "{{ backup_data | length }}"
      failed_backups: "{{ failed_backups_list | length }}"
      successful_backups: "{{ (backup_data | length) - (failed_backups_list | length) }}"

      validation_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "Resumen {{ current_database_key }}"
  ansible.builtin.debug:
    msg:
      - "{{ current_database_key }}: {{ backup_data | length }} backups,
        {{ failed_backups_list | length }} errores, ARCHIVELOG: {{ 'OK' if archivelog_backups | length > 0 else 'FALTA' }}"
  vars:
    msg_string: "{{ backup_result.msg | default('') | string }}"
    has_oracle_error: "{{ msg_string is search('ORA-') or msg_string is search('TNS-') }}"
    has_failed: "{{ backup_result.failed | default(false) }}"
    is_successful: "{{ not has_failed and not has_oracle_error }}"
    backup_data: "{{ backup_result.msg | default([]) if is_successful and backup_result.msg is iterable and backup_result.msg is not string else [] }}"
    failed_backups_list: "{{ backup_data | selectattr('5', 'equalto', 'FAILED') | list }}"
    archivelog_backups: "{{ backup_data | selectattr('4', 'equalto', 'ARCHIVELOG') | list }}"
