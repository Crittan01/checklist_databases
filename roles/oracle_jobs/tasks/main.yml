---
# tasks file for roles/oracle_jobs
- name: "Validar jobs {{ current_db_key }}"
  opitzconsulting.ansible_oracle.oracle_sql:
    hostname: "{{ current_db.direccion_ip }}"
    port: "{{ current_db.puerto }}"
    service_name: "{{ current_db.cadena_tns }}"
    username: "{{ current_db.usuario }}"
    password: "{{ current_db.password }}"
    sql: |
      SELECT
        JOB,
        SCHEMA_USER,
        FAILURES as FAIL,
        BROKEN,
        to_char(LAST_DATE, 'DD-MON-YYYY HH24:MI:SS') as LAST_DATE,
        REPLACE(TRANSLATE(WHAT,chr(10)||chr(13), '  '), '"', '''') as WHAT
      FROM DBA_JOBS
      ORDER BY SCHEMA_USER, JOB
    mode: normal
  register: jobs_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Registrar resultado {{ current_db_key }}"
  ansible.builtin.set_fact:
    job_results: "{{ job_results + [result_item] }}"
  vars:
    result_item:
      instancia: "{{ current_db_key }}"
      exitoso: "{{ not (jobs_result.failed | default(true)) }}"
      error: "{{ jobs_result.msg | default('') if jobs_result.failed | default(false) else '' }}"
      data: "{{ jobs_result.query_result | default([]) if not (jobs_result.failed | default(true)) else [] }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
