---
# tasks file for roles/oracle_jobs - CORREGIDO
- name: "Validar jobs Oracle en {{ oracle_jobs_current_database_key }}"
  mi_org.oracle.oracle_sql_async:
    hostname: "{{ oracle_jobs_current_database.direccion_ip }}"
    port: "{{ oracle_jobs_current_database.puerto }}"
    service_name: "{{ oracle_jobs_current_database.cadena_tns }}"
    username: "{{ oracle_jobs_current_database.usuario }}"
    password: "{{ oracle_jobs_current_database.password }}"
    sql: |
      SELECT
        (SELECT host_name FROM v$instance) as HOST_NAME,
        (SELECT instance_name FROM v$instance) as INSTANCIA,
        JOB,
        SCHEMA_USER,
        FAILURES as FAIL,
        BROKEN,
        to_char(LAST_DATE, 'DD-MON-YYYY HH24:MI:SS') as LAST_DATE,
        REPLACE(TRANSLATE(WHAT,chr(10)||chr(13), '  '), '"', '''') as WHAT
      FROM DBA_JOBS
      WHERE BROKEN='Y'
      ORDER BY SCHEMA_USER, JOB
    mode: normal
  register: jobs_validation_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Procesar resultados de jobs {{ oracle_jobs_current_database_key }}"
  ansible.builtin.set_fact:
    job_results: "{{ job_results + [job_item] }}"
  vars:
    # Datos de jobs (puede ser vacío si no hay jobs broken)
    jobs_data: "{{ jobs_validation_result.msg | default([]) if jobs_validation_result.msg is iterable and jobs_validation_result.msg is not string else [] }}"

    job_item:
      instancia_key: "{{ oracle_jobs_current_database_key }}"
      instancia: "{{ oracle_jobs_current_database.instancia }}"
      host: "{{ oracle_jobs_current_database.host }}"
      direccion_ip: "{{ oracle_jobs_current_database.direccion_ip }}"

      # CORRECCIÓN: Una query exitosa sin errores Oracle es siempre EXITOSA,
      # independientemente de si retorna datos o no
      jobs_validation_successful: "{{ not (jobs_validation_result.failed | default(false)) }}"
      jobs_validation_error: "{{ jobs_validation_result.msg if jobs_validation_result.failed | default(false) else '' }}"

      # Datos (puede ser lista vacía)
      jobs_data: "{{ jobs_data }}"
      broken_jobs: "{{ jobs_data }}"

      # Contadores por índices
      jobs_with_failures: "{{ jobs_data | selectattr('4', 'equalto', 1) | list }}"

      # Contadores (pueden ser 0)
      total_jobs: "{{ jobs_data | length }}"
      broken_jobs_count: "{{ jobs_data | length }}"
      jobs_with_failures_count: "{{ jobs_data | selectattr('4', 'equalto', 1) | list | length }}"
      active_jobs: 0

      validation_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "Mostrar resumen de jobs {{ oracle_jobs_current_database_key }}"
  ansible.builtin.debug:
    msg:
      - "Instancia: {{ oracle_jobs_current_database_key }}"
      - "Validación: {{ 'EXITOSA' if (jobs_validation_result.msg | default([]) | length > 0)
        or not (jobs_validation_result.failed | default(false)) else 'ERROR' }}"
      - "Jobs BROKEN encontrados: {{ jobs_validation_result.msg | default([]) | length }}"
      - "Con failures > 0: {{ jobs_validation_result.msg | default([]) | selectattr('4', 'equalto', 1) | list | length }}"
      - "{% if jobs_validation_result.msg | default([]) | length == 0 %}Sin jobs broken en esta instancia{% endif %}"
