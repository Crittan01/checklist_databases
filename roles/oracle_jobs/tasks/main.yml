---
# Validación de jobs - SIMPLIFICADA
- name: "Jobs broken {{ current_database_key }}"
  mi_org.oracle.oracle_sql_async:
    hostname: "{{ current_database.direccion_ip }}"
    port: "{{ current_database.puerto }}"
    service_name: "{{ current_database.cadena_tns }}"
    username: "{{ current_database.usuario }}"
    password: "{{ current_database.password }}"
    sql: |
      SELECT
        (SELECT host_name FROM v$instance),
        (SELECT instance_name FROM v$instance),
        JOB,
        SCHEMA_USER,
        FAILURES,
        BROKEN,
        to_char(LAST_DATE, 'DD-MON-YYYY HH24:MI:SS'),
        REPLACE(TRANSLATE(WHAT,chr(10)||chr(13), '  '), '"', '''')
      FROM DBA_JOBS
      WHERE BROKEN='Y'
      ORDER BY SCHEMA_USER, JOB
    mode: normal
  register: jobs_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Procesar jobs {{ current_database_key }}"
  ansible.builtin.set_fact:
    job_results: "{{ job_results + [job_item] }}"
  vars:
    # Detección de errores usando regex nativo
    msg_string: "{{ jobs_result.msg | default('') | string }}"
    has_oracle_error: "{{ msg_string is search('ORA-') or msg_string is search('TNS-') }}"
    has_failed: "{{ jobs_result.failed | default(false) }}"
    is_successful: "{{ not has_failed and not has_oracle_error }}"

    # Datos solo si es exitoso
    jobs_data: "{{ jobs_result.msg | default([]) if is_successful and jobs_result.msg is iterable and jobs_result.msg is not string else [] }}"

    # Análisis de jobs con failures (índice 4 = FAILURES)
    jobs_with_failures_list: "{{ jobs_data | selectattr('4', 'greaterthan', 0) | list }}"

    job_item:
      instancia_key: "{{ current_database_key }}"
      instancia: "{{ current_database.instancia }}"
      host: "{{ current_database.host }}"
      direccion_ip: "{{ current_database.direccion_ip }}"

      # Estado de validación
      jobs_validation_successful: "{{ is_successful }}"
      jobs_validation_error: "{{ jobs_result.msg | default('') if not is_successful else '' }}"

      # Datos y análisis
      jobs_data: "{{ jobs_data }}"
      broken_jobs: "{{ jobs_data }}" # Todos son broken porque el WHERE filtra
      jobs_with_failures: "{{ jobs_with_failures_list }}"

      # Contadores simplificados
      total_jobs: "{{ jobs_data | length }}"
      broken_jobs_count: "{{ jobs_data | length }}"
      jobs_with_failures_count: "{{ jobs_with_failures_list | length }}"
      active_jobs: 0, # No aplica porque solo consultamos broken

      validation_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "Resumen {{ current_database_key }}"
  ansible.builtin.debug:
    msg:
      - "{{ current_database_key }}: {{ jobs_data | length }} jobs broken, {{ jobs_with_failures_list | length }} con failures"
  vars:
    msg_string: "{{ jobs_result.msg | default('') | string }}"
    has_oracle_error: "{{ msg_string is search('ORA-') or msg_string is search('TNS-') }}"
    has_failed: "{{ jobs_result.failed | default(false) }}"
    is_successful: "{{ not has_failed and not has_oracle_error }}"
    jobs_data: "{{ jobs_result.msg | default([]) if is_successful and jobs_result.msg is iterable and jobs_result.msg is not string else [] }}"
    jobs_with_failures_list: "{{ jobs_data | selectattr('4', 'greaterthan', 0) | list }}"
