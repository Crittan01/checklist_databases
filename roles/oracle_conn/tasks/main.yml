---
# tasks file for roles/oracle_conn
- name: "Conexión completa a {{ current_database_key }}"
  mi_org.oracle.oracle_sql_async:
    hostname: "{{ current_database.direccion_ip }}"
    port: "{{ current_database.port }}"
    service_name: "{{ current_database.cadena_tns }}"
    username: "{{ current_database.usuario }}"
    password: "{{ current_database.password }}"
    sql: |
      SELECT
        '{{ current_database_key }}' as instancia_key,
        sys_context('USERENV', 'DB_NAME') as database_name,
        sys_context('USERENV', 'INSTANCE_NAME') as instance_name,
        sys_context('USERENV', 'SERVER_HOST') as server_host,
        to_char(sysdate, 'YYYY-MM-DD HH24:MI:SS') as connection_time,
        (SELECT version FROM v$instance) as database_version,
        (SELECT status FROM v$instance) as instance_status,
        (SELECT database_role FROM v$database) as database_role,
        (SELECT open_mode FROM v$database) as open_mode
      FROM dual
    mode: normal
  register: connection_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Procesar conectividad {{ current_database_key }}"
  ansible.builtin.set_fact:
    connectivity_results: "{{ connectivity_results + [connectivity_item] }}"
  vars:
    # Detección de errores Oracle usando regex
    msg_string: "{{ connection_result.msg | default('') | string }}"
    has_oracle_error: "{{ msg_string is search('ORA-') or msg_string is search('TNS-') }}"
    has_failed: "{{ connection_result.failed | default(false) }}"
    is_successful: "{{ not has_failed and not has_oracle_error }}"

    connectivity_item:
      # Identificadores estandarizados
      instancia_key: "{{ current_database_key }}"
      instancia: "{{ current_database.instancia }}"
      host: "{{ current_database.host }}"
      direccion_ip: "{{ current_database.direccion_ip }}"
      puerto: "{{ current_database.puerto }}"
      cadena_tns: "{{ current_database.cadena_tns }}"
      usuario: "{{ current_database.usuario }}"

      # Metadatos
      motor_bd: "{{ current_database.motor_bd }}"
      sistema_operativo: "{{ current_database.sistema_operativo }}"
      release_so: "{{ current_database.release_so }}"
      release_bd: "{{ current_database.release_bd }}"

      # Resultado simplificado
      connection_successful: "{{ is_successful }}"
      connection_error: "{{ connection_result.msg | default('Error desconocido') if not is_successful else '' }}"
      database_info: "{{ connection_result.msg[0] | default({}) if is_successful
        and connection_result.msg is iterable and connection_result.msg is not string else {} }}"
      test_timestamp: "{{ ansible_date_time.iso8601 }}"

- name: "Estado de {{ current_database_key }}"
  ansible.builtin.debug:
    msg: "{{ current_database_key }}: {{ 'CONECTADA' if is_successful else 'ERROR - ' + (connection_result.msg | default('Sin detalles') | string) }}"
  vars:
    msg_string: "{{ connection_result.msg | default('') | string }}"
    has_oracle_error: "{{ msg_string is search('ORA-') or msg_string is search('TNS-') }}"
    has_failed: "{{ connection_result.failed | default(false) }}"
    is_successful: "{{ not has_failed and not has_oracle_error }}"
