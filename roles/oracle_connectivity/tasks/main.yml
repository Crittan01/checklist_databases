---
# tasks file for roles/oracle_connectivity
- name: "Probar conexión {{ current_db_key }}"
  opitzconsulting.ansible_oracle.oracle_sql:
    hostname: "{{ current_db.direccion_ip }}"
    port: "{{ current_db.puerto }}"
    service_name: "{{ current_db.cadena_tns }}"
    username: "{{ current_db.usuario }}"
    password: "{{ current_db.password }}"
    sql: "SELECT 1 FROM dual"
    mode: normal
  register: conn_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Registrar resultado {{ current_db_key }}"
  ansible.builtin.set_fact:
    connectivity_results: "{{ connectivity_results + [result_item] }}"
  vars:
    result_item:
      instancia: "{{ current_db_key }}"
      host: "{{ current_db.direccion_ip }}"
      puerto: "{{ current_db.puerto }}"
      usuario: "{{ current_db.usuario }}"
      conectado: "{{ not (conn_result.failed | default(true)) }}"
      error: "{{ conn_result.msg | default('') if conn_result.failed | default(false) else '' }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
