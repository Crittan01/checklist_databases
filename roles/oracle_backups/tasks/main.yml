---
# tasks file for roles/oracle_backups
- name: "Validar backups {{ current_db_key }}"
  opitzconsulting.ansible_oracle.oracle_sql:
    hostname: "{{ current_db.direccion_ip }}"
    port: "{{ current_db.puerto }}"
    service_name: "{{ current_db.cadena_tns }}"
    username: "{{ current_db.usuario }}"
    password: "{{ current_db.password }}"
    sql: |
      SELECT
        vi.host_name as HOST,
        vi.instance_name as INSTANCE,
        TO_CHAR(rbd.start_time,'MM-DD-YYYY HH24:MI:SS') as start_time,
        TO_CHAR(rbd.end_time,'MM-DD-YYYY HH24:MI:SS') as end_time,
        rbd.input_type,
        rbd.status,
        (rbd.end_time-rbd.start_time)*24*60 as min_duration,
        rbd.output_bytes_display as TAMANO,
        rbd.output_device_type
      FROM v$rman_backup_job_details rbd, v$instance vi
      WHERE rbd.start_time > sysdate - 0.5
      ORDER BY rbd.start_time
    mode: normal
  register: backup_result
  failed_when: false
  timeout: "{{ oracle_timeout }}"

- name: "Registrar resultado {{ current_db_key }}"
  ansible.builtin.set_fact:
    backup_results: "{{ backup_results + [result_item] }}"
  vars:
    result_item:
      instancia: "{{ current_db_key }}"
      exitoso: "{{ not (backup_result.failed | default(true)) }}"
      error: "{{ backup_result.msg | default('') if backup_result.failed | default(false) else '' }}"
      data: "{{ backup_result.query_result | default([]) if not (backup_result.failed | default(true)) else [] }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
