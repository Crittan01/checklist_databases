---
# Generación de reporte - OPTIMIZADA
- name: "Crear directorio de reportes"
  ansible.builtin.file:
    path: "{{ ansible_env.PWD }}/reports"
    state: directory
    mode: "0755"

- name: "Calcular estadísticas consolidadas"
  ansible.builtin.set_fact:
    stats:
      # Bases de datos
      total_dbs: "{{ report_oracle_databases.keys() | list | length }}"

      # Conectividad
      successful_conns: "{{ report_connectivity_results | selectattr('connection_successful', 'equalto', true) | list | length }}"
      failed_conns: "{{ report_connectivity_results | selectattr('connection_successful', 'equalto', false) | list | length }}"
      connectivity_percent:
        "{{ ((report_connectivity_results | selectattr('connection_successful', 'equalto', true) | list
        | length / report_connectivity_results | length * 100) | round) if report_connectivity_results | length > 0 else 0 }}"

      # Backups
      backup_errors_count: "{{ report_backup_results | map(attribute='failed_backups') | map('int') | sum }}"
      instances_no_archivelog_count: "{{ report_backup_results | selectattr('no_archivelog_in_12h', 'equalto', true) | list | length }}"

      # Jobs
      broken_jobs_count: "{{ report_job_results | map(attribute='broken_jobs_count') | map('int') | sum }}"
      jobs_failures_count: "{{ report_job_results | map(attribute='jobs_with_failures_count') | map('int') | sum }}"

- name: "Calcular alertas totales"
  ansible.builtin.set_fact:
    stats: "{{ stats | combine({'total_alerts': (stats.failed_conns | int) +
      (stats.backup_errors_count | int) + (stats.instances_no_archivelog_count | int) +
      (stats.broken_jobs_count | int)}) }}"

- name: "Generar reporte HTML"
  ansible.builtin.template:
    src: "oracle_inventory_report.j2"
    dest: "{{ ansible_env.PWD }}/reports/oracle_inventory_report_{{ ansible_date_time.date }}.html"
    mode: "0644"
  vars:
    hostname: "{{ ansible_hostname }}"
    execution_date: "{{ ansible_date_time.date }}"
    execution_time: "{{ ansible_date_time.time }}"
    connectivity_results: "{{ report_connectivity_results }}"
    backup_results: "{{ report_backup_results }}"
    job_results: "{{ report_job_results }}"

- name: "Resumen del reporte"
  ansible.builtin.debug:
    msg:
      - "=== REPORTE GENERADO ==="
      - "Archivo: reports/oracle_inventory_report_{{ ansible_date_time.date }}.html"
      - "Conectividad: {{ stats.connectivity_percent }}% ({{ stats.successful_conns }}/{{ stats.total_dbs }})"
      - "Alertas totales: {{ stats.total_alerts }}"
      - "  └─ Conectividad: {{ stats.failed_conns }}"
      - "  └─ Backups: {{ stats.backup_errors_count + stats.instances_no_archivelog_count }}"
      - "  └─ Jobs: {{ stats.broken_jobs_count }}"
