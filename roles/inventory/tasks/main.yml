---
# tasks file for roles/inventory
- name: "Crear directorio de reportes"
  ansible.builtin.file:
    path: "{{ ansible_env.PWD }}/reports"
    state: directory
    mode: "0755"

# VALIDACIÓN DE LISTAS - Evitar errores con listas (vacias))
- name: "Validar y inicializar listas de resultados"
  ansible.builtin.set_fact:
    safe_connectivity_results: "{{ report_connectivity_results | default([]) }}"
    safe_backup_results: "{{ report_backup_results | default([]) }}"
    safe_job_results: "{{ report_job_results | default([]) }}"

- name: "Calcular estadísticas consolidadas"
  ansible.builtin.set_fact:
    stats:
      # Bases de datos
      total_dbs: "{{ report_oracle_databases.keys() | list | length }}"

      # Conectividad
      successful_conns: "{{ safe_connectivity_results | selectattr('connection_successful', 'equalto', true) | list | length }}"
      failed_conns: "{{ safe_connectivity_results | selectattr('connection_successful', 'equalto', false) | list | length }}"
      connectivity_percent:
        "{{ ((safe_connectivity_results | selectattr('connection_successful', 'equalto', true) | list
        | length / safe_connectivity_results | length * 100) | round) if safe_connectivity_results | length > 0 else 0 }}"

      # Backups
      backup_errors_count: "{{ safe_backup_results | map(attribute='failed_backups') | map('int') | sum }}"
      instances_no_archivelog_count: "{{ safe_backup_results | selectattr('no_archivelog_in_12h', 'equalto', true) | list | length }}"

      # Jobs
      broken_jobs_count: "{{ safe_job_results | map(attribute='broken_jobs_count') | map('int') | sum }}"
      jobs_failures_count: "{{ safe_job_results | map(attribute='jobs_with_failures_count') | map('int') | sum }}"

- name: "Calcular alertas totales"
  ansible.builtin.set_fact:
    stats: "{{ stats | combine({'total_alerts': (stats.failed_conns | int) +
      (stats.backup_errors_count | int) + (stats.instances_no_archivelog_count | int) +
      (stats.broken_jobs_count | int)}) }}"

# GENERAR REPORTE - MANTENER IGUAL
- name: "Generar reporte HTML"
  ansible.builtin.template:
    src: "oracle_inventory_report.j2" # MISMO TEMPLATE
    dest: "{{ ansible_env.PWD }}/reports/oracle_inventory_report_{{ ansible_date_time.date }}.html"
    mode: "0644"
  vars:
    # VARIABLES DIRECTAS - Sin referencias circulares
    hostname: "{{ ansible_hostname }}"
    execution_date: "{{ ansible_date_time.date }}"
    execution_time: "{{ ansible_date_time.time }}"
    # USAR VARIABLES SEGURAS
    connectivity_results: "{{ safe_connectivity_results }}"
    backup_results: "{{ safe_backup_results }}"
    job_results: "{{ safe_job_results }}"

- name: "Resumen del reporte"
  ansible.builtin.debug:
    msg:
      - "=== REPORTE GENERADO ==="
      - "Archivo: reports/oracle_inventory_report_{{ ansible_date_time.date }}.html"
      - "Conectividad: {{ stats.connectivity_percent }}% ({{ stats.successful_conns }}/{{ stats.total_dbs }})"
      - "Alertas totales: {{ stats.total_alerts }}"
      - "  └─ Conectividad: {{ stats.failed_conns }}"
      - "  └─ Backups: {{ (stats.backup_errors_count | int) + (stats.instances_no_archivelog_count | int) }}"
      - "  └─ Jobs: {{ stats.broken_jobs_count | int }}"
