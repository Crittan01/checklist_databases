---
# Playbook modular - Solo Validación de Diskgroups ASM
- name: Oracle Database Diskgroups Only
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    connectivity_results: []
    diskgroup_results: []
    target_database: "{{ target_database | default('') }}"

  tasks:
    # Conectividad primero
    - name: "Conectividad {{ item.key }}"
      ansible.builtin.include_role:
        name: oracle_connectivity
      vars:
        current_db_key: "{{ item.key }}"
        current_db: "{{ item.value }}"
      loop: "{{ oracle_databases | dict2items }}"
      when: target_database == '' or item.key == target_database

    # Solo diskgroups en conectadas
    - name: "Diskgroups {{ item.instancia }}"
      ansible.builtin.include_role:
        name: oracle_diskgroups
      vars:
        current_db_key: "{{ item.instancia }}"
        current_db: "{{ oracle_databases[item.instancia] }}"
      loop: "{{ connectivity_results | selectattr('conectado', 'equalto', true) | list }}"

    # Reporte específico
    - name: "Generar reporte diskgroups"
      ansible.builtin.include_role:
        name: inventory
      vars:
        backup_results: []
        job_results: []

  post_tasks:
    - name: "Resumen diskgroups"
      ansible.builtin.debug:
        msg:
          - "Instancias validadas: {{ diskgroup_results | length }}"
          - "Diskgroups críticos: {{ diskgroup_results | map(attribute='data') | flatten | length }}"
